name: Build & Release BracketBuddy

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_path: out/make/squirrel.windows/x64/BracketBuddy-Setup.exe
            artifact_name: BracketBuddy-Setup.exe
            # macOS arm64
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact_path: out/make/BracketBuddy*.dmg
            artifact_name: BracketBuddy-macOS-arm64.dmg

          # macOS x64
          - os: macos-latest
            platform: darwin
            arch: x64
            artifact_path: out/make/BracketBuddy*.dmg
            artifact_name: BracketBuddy-macOS-x64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install React app dependencies
        run: |
          cd src-react
          npm ci

      - name: Build ${{ matrix.platform }} ${{ matrix.arch }}
        run: npm run make -- --arch=${{ matrix.arch }} --platform=${{ matrix.platform }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Move 'latest' tag to current commit
        if: matrix.os == 'windows-latest'
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Release
          body: |
            Automated release of BracketBuddy

            **Downloads:**
            - Windows: BracketBuddy-Setup.exe
            - macOS (Universal): BracketBuddy-macOS-Universal.dmg
          artifacts: ${{ matrix.artifact_path }}
          allowUpdates: true
          replacesArtifacts: false
