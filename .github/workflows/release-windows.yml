name: Build & Release BracketBuddy (Windows)

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install React app dependencies
        run: |
          cd src-react
          npm ci

      - name: Build Windows x64
        run: npm run make -- --arch=x64 --platform=win32

      - name: Debug - List output files
        shell: bash
        run: |
          echo "Listing out/make directory:"
          ls -R out/make/ || true

      - name: Rename artifact
        shell: bash
        run: |
          # Find the Setup.exe file
          SETUP_FILE=$(find out/make -name "*Setup.exe" -type f | head -n 1)
          if [ -n "$SETUP_FILE" ]; then
            cp "$SETUP_FILE" "BracketBuddy-Setup.exe"
            echo "Copied $SETUP_FILE to BracketBuddy-Setup.exe"
          else
            echo "Error: No Setup.exe file found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BracketBuddy-Setup.exe
          path: BracketBuddy-Setup.exe
          if-no-files-found: error

      - name: Move 'latest' tag to current commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Release
          body: |
            Automated release of BracketBuddy

            **Downloads:**
            - Windows: BracketBuddy-Setup.exe
            - macOS (M Chips): BracketBuddy-macOS-arm64.dmg
            - macOS (Intel): BracketBuddy-macOS-x64.dmg
          artifacts: BracketBuddy-Setup.exe
          allowUpdates: true
          replacesArtifacts: true
