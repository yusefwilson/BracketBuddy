name: Build & Release BracketBuddy (Windows)

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install React app dependencies
        run: |
          cd src-react
          npm ci

      - name: Build Windows x64
        run: npm run make -- --arch=x64 --platform=win32

      - name: Debug - List output files
        shell: bash
        run: |
          echo "Listing out/make directory:"
          ls -R out/make/ || true

      - name: Collect artifacts and generate latest.yml
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIR="out/make/squirrel.windows/x64"
          cp "$DIR/BracketBuddy-Setup.exe" BracketBuddy-Setup.exe
          cp "$DIR/RELEASES" RELEASES
          NUPKG=$(find "$DIR" -name "*.nupkg" | head -n 1)
          NUPKG_NAME=$(basename "$NUPKG")
          cp "$NUPKG" "$NUPKG_NAME"
          # SHA512 in base64 (electron-updater requires base64, not hex)
          SHA512=$(openssl dgst -sha512 -binary "$NUPKG_NAME" | base64 -w 0)
          SIZE=$(wc -c < "$NUPKG_NAME" | tr -d ' ')
          cat > latest.yml << EOF
          version: ${VERSION}
          files:
            - url: ${NUPKG_NAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${NUPKG_NAME}
          sha512: ${SHA512}
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")'
          EOF
      - name: Move 'latest' tag to current commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Release
          body: |
            Automated release of BracketBuddy

            **Downloads:**
            - Windows: BracketBuddy-Setup.exe
            - macOS (Apple Silicon): BracketBuddy-macOS-apple-silicon.dmg
            - macOS (Intel): BracketBuddy-macOS-intel.dmg
          artifacts: "BracketBuddy-Setup.exe,BracketBuddy-*.nupkg,RELEASES,latest.yml"
          allowUpdates: true
          replacesArtifacts: true
