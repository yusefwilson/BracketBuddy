name: Build & Release BracketBuddy (macOS Universal)

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install root dependencies
        run: npm ci

      - name: Install React app dependencies
        run: cd src-react && npm ci

      - name: Build macOS Universal Binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make -- --arch=universal --platform=darwin

      - name: Rename artifact
        shell: bash
        run: |
          DMG_FILE=$(find out/make -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "BracketBuddy-macOS-universal.dmg"
            echo "Renamed $DMG_FILE to BracketBuddy-macOS-universal.dmg"
          else
            echo "Error: No DMG file found"
            exit 1
          fi

      - name: Verify code signature
        run: |
          hdiutil attach "BracketBuddy-macOS-universal.dmg" -nobrowse -quiet
          APP_PATH=$(find /Volumes -name "*.app" -maxdepth 2 2>/dev/null | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Verifying signature of: $APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi
          hdiutil detach /Volumes/BracketBuddy* -quiet || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BracketBuddy-macOS-universal.dmg
          path: BracketBuddy-macOS-universal.dmg
          if-no-files-found: error

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Release
          body: |
            Automated release of BracketBuddy

            **Downloads:**
            - Windows: BracketBuddy-Setup.exe
            - macOS (Intel & Apple Silicon): BracketBuddy-macOS-universal.dmg
          artifacts: BracketBuddy-macOS-universal.dmg
          allowUpdates: true
          replacesArtifacts: true

      - name: Cleanup
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
