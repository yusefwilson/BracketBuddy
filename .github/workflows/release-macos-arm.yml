name: Build & Release BracketBuddy (macOS ARM)

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-and-release-macos-arm:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install React app dependencies
        run: |
          cd src-react
          npm ci

      - name: Build macOS arm64
        run: npm run make -- --arch=arm64 --platform=darwin

      - name: Debug - List output files
        shell: bash
        run: |
          echo "Listing out/make directory:"
          ls -R out/make/ || true

      - name: Rename artifact
        shell: bash
        run: |
          # Find the DMG file and rename it
          DMG_FILE=$(find out/make -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "BracketBuddy-macOS-arm64.dmg"
            echo "Renamed $DMG_FILE to BracketBuddy-macOS-arm64.dmg"
          else
            echo "Error: No DMG file found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BracketBuddy-macOS-arm64.dmg
          path: BracketBuddy-macOS-arm64.dmg
          if-no-files-found: error

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Release
          body: |
            Automated release of BracketBuddy

            **Downloads:**
            - Windows: BracketBuddy-Setup.exe
            - macOS (M Chips): BracketBuddy-macOS-arm64.dmg
            - macOS (Intel): BracketBuddy-macOS-x64.dmg
          artifacts: BracketBuddy-macOS-arm64.dmg
          allowUpdates: true
          replacesArtifacts: false
