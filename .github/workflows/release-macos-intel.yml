name: Build & Release BracketBuddy (macOS Intel)

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build-macos-intel:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install dependencies
        run: |
          npm ci
          cd src-react && npm ci

      - name: Build macOS Intel (x64)
        env:
          CI: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make -- --platform=darwin --arch=x64

      - name: Collect artifacts and generate x64-mac.yml
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP=$(find out/make/zip/darwin/x64 -name "*.zip" | head -n 1)
          ZIP_NAME="BracketBuddy-darwin-x64-${VERSION}.zip"
          cp "$ZIP" "$ZIP_NAME"
          DMG=$(find out/make -name "*.dmg" | head -n 1)
          cp "$DMG" BracketBuddy-macOS-intel.dmg
          SHA512=$(openssl dgst -sha512 -binary "$ZIP_NAME" | base64)
          SIZE=$(wc -c < "$ZIP_NAME" | tr -d ' ')
          cat > x64-mac.yml << EOF
          version: ${VERSION}
          files:
            - url: ${ZIP_NAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${ZIP_NAME}
          sha512: ${SHA512}
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")'
          EOF

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "BracketBuddy-macOS-intel.dmg,BracketBuddy-darwin-x64-*.zip,x64-mac.yml"

      - name: Cleanup
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
